name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build all C sources
        shell: pwsh
        run: |
          $sources = @(Get-ChildItem -File -Filter '*.c')
          if ($sources.Count -eq 0) {
            throw 'No C source files found.'
          }

          $outputDirectory = Join-Path $PWD 'build'
          New-Item -ItemType Directory -Force -Path $outputDirectory | Out-Null

          foreach ($source in $sources) {
            $outputPath = Join-Path $outputDirectory ($source.BaseName + '.exe')
            $objectPath = Join-Path $outputDirectory ($source.BaseName + '.obj')
            & cl.exe /nologo /O2 "/Fe$outputPath" "/Fo$objectPath" $source.FullName user32.lib gdi32.lib
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to build $($source.Name)."
            }
          }

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: dotcross-binaries
          path: build/*.exe
          if-no-files-found: error
